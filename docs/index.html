/* главная: герой с логотипом, установка, руководства */
.hero { position: relative; overflow: hidden; padding: 72px 0 76px; }

@keyframes glow { to { transform: translate(-80px, 60px) scale(1.2); } }
@keyframes pulse { 50% { transform: scale(1.18); opacity: .6; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glowp { 50% { transform: scale(1.12); opacity: .65; } }
@keyframes breathe { 50% { transform: scale(1.05); } }
@keyframes sweep { 0%, 55% { background-position: 130% 0; } 100% { background-position: -60% 0; } }
.logo-stage { position: relative; width: min(400px, 86vw); aspect-ratio: 1; margin: 0 auto; animation: pop .9s cubic-bezier(.2,.7,.2,1) backwards; }
.ls-glow { position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,169,59,.38), transparent 72%); animation: glowp 4.5s ease-in-out infinite; }
.ls-ring, .ls-ring2 { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ls-ring { animation: spin 32s linear infinite; }
.ls-ring2 { animation: spin 55s linear infinite reverse; }
.ls-ring .dash { stroke-dasharray: 34 11 6 11; }
.ls-ring .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
.logo-disc { position: absolute; inset: 11%; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 5px rgba(242,169,59,.28), 0 36px 80px -24px rgba(0,0,0,.8); }
.logo-disc img { width: 100%; height: 100%; display: block; animation: breathe 8s ease-in-out infinite; }
.logo-disc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.34) 50%, transparent 58%); background-size: 260% 100%; background-position: 130% 0; animation: sweep 6.5s ease-in-out infinite; }

.shot-tabs button:hover { border-color: var(--sky); }
.shot-tabs button[aria-pressed="true"] { background: var(--head-soft, #D7F0FC); border-color: var(--sky); }
:root[data-theme="dark"] .shot-tabs button[aria-pressed="true"] { background: #12385A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shot-tabs button[aria-pressed="true"] { background: #12385A; } }
.shot { margin: 0 0 40px; }
.shot-stage { display: grid; place-items: center; min-height: 220px; padding: 28px 16px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(135deg, var(--bg), var(--bg-2)); }
.shot-stage img { max-width: 100%; height: auto; width: auto; filter: drop-shadow(0 18px 28px rgba(13,24,48,.28)); }
.shot figcaption { margin-top: 12px; color: var(--muted); font-size: 15px; max-width: 820px; }
.setg .card h3 { font-size: 18px; }

.parse-link { display: inline-block; margin-top: 26px; font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--amber); }
.man { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 22px; }
.man .card { display: flex; flex-direction: column; gap: 14px; }
.man h3 { margin: 0; }
.man .pdfs { margin-top: auto; }
.mnote { margin-top: 18px; color: var(--muted); font-size: 14.5px; }
.isteps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 18px; padding: 0; list-style: none; margin: 0 0 36px; }
.isteps li { counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 22px 70px; position: relative; box-shadow: var(--shadow); }
.isteps li::before { content: counter(s); position: absolute; left: 20px; top: 20px; width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: var(--amber); border: 2px solid var(--amber); display: grid; place-items: center; font-weight: 700; }
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px; }
.dl .card .btn { margin-top: 14px; }
.dl code { display: inline-block; max-width: 100%; margin: 6px 0; padding: 3px 8px; border-radius: 6px; background: var(--bg-2); color: var(--text); font: 13.5px Consolas, "Cascadia Mono", Menlo, monospace; overflow-wrap: anywhere; }
.req { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
details { max-width: 820px; }
summary { list-style: none; display: flex; justify-content: space-between; gap: 12px; }

}

<script src="site.js"></script>
<script>
(function () {
  var H = window.HVAC, cur = "settings";
  var img = document.getElementById("shotImg"), cap = document.getElementById("shotCap"), tabs = document.querySelectorAll("#shotTabs button");
  function render() {
    img.onload = function () { img.style.width = Math.round(img.naturalWidth / 2) + "px"; };
    img.src = "img/win/" + cur + "-" + H.lang() + "-" + H.scheme() + ".png";
    cap.textContent = H.t("look.c." + cur);
    tabs.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.shot === cur); });
  }
  tabs.forEach(function (b) { b.addEventListener("click", function () { cur = b.dataset.shot; render(); }); });
  H.onLang(render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
})();
</script>
