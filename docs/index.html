<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVAC Stuff — Revit add-in</title>
<meta name="description" content="HVAC Stuff — Revit add-in for HVAC designers: flex ducts in one or two clicks.">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213D'/%3E%3Cpath d='M10 44 C26 44 22 20 38 20 L54 20' fill='none' stroke='%23F2A93B' stroke-width='6' stroke-dasharray='12 5 3 5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --navy: #14213D; --navy-2: #1c2d52; --paper: #FBFAF6; --amber: #F2A93B; --sky: #5BB6E8;
  --bg: #FBFAF6; --bg-2: #F3F1EA; --card: #ffffff; --text: #14213D; --muted: #5d6881; --line: #e4e0d4;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 12px 32px -12px rgba(20,33,61,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1628; --bg-2: #121c33; --card: #16223d; --text: #eef1f8; --muted: #9aa7bf; --line: #26334f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #0e1628; --bg-2: #121c33; --card: #16223d; --text: #eef1f8; --muted: #9aa7bf; --line: #26334f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
img, svg { max-width: 100%; }
.wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }
section { padding: 88px 0; }
.alt { background: var(--bg-2); }
.eyebrow { color: var(--amber); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; margin: 0 0 10px; }
h2 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; margin: 0 0 14px; letter-spacing: -.01em; }
.lead { color: var(--muted); font-size: 18px; max-width: 680px; margin: 0 0 44px; }

/* nav */
.nav { position: sticky; top: 0; z-index: 20; background: rgba(20,33,61,.92); backdrop-filter: blur(10px); color: #fff; }
.nav .wrap { display: flex; align-items: center; gap: 22px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; font-size: 18px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.nav a.lnk { color: #c9d3e6; text-decoration: none; font-size: 15px; }
.nav a.lnk:hover { color: #fff; }
.lang { display: flex; border: 1px solid #3a4a72; border-radius: 8px; overflow: hidden; }
.lang button { background: none; border: 0; color: #c9d3e6; padding: 5px 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--amber); color: var(--navy); }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--amber); color: var(--navy); font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 10px; border: 0; cursor: pointer; font-size: 16px; transition: transform .15s, box-shadow .15s; box-shadow: 0 6px 18px -6px rgba(242,169,59,.7); }
.btn:hover { transform: translateY(-2px); }
.btn.sm { padding: 8px 16px; font-size: 14px; box-shadow: none; }
.btn.ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; box-shadow: none; }
@media (max-width: 860px) { .nav a.lnk { display: none; } }

/* hero */
.hero { background: radial-gradient(900px 420px at 85% 10%, rgba(91,182,232,.22), transparent 60%), linear-gradient(180deg, var(--navy), #0f1a33); color: #fff; padding: 84px 0 0; overflow: hidden; }
.hero .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(38px, 6vw, 66px); line-height: 1.05; margin: 0 0 18px; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero p.sub { font-size: 20px; color: #c9d3e6; max-width: 540px; margin: 0 0 30px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.meta { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 4px 12px; border-radius: 99px; border: 1px solid #3a4a72; color: #c9d3e6; }
.chip b { color: var(--amber); }
.duct { width: 100%; }
.duct .flex { stroke-dasharray: 34 11 6 11; animation: dash 1.6s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -62; } }
.duct .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.18); opacity: .6; } }
@media (max-width: 860px) { .hero .grid { grid-template-columns: 1fr; } .duct { order: -1; max-width: 460px; } }
.ribbon-strip { margin-top: 64px; background: var(--card); border-radius: 18px 18px 0 0; padding: 28px 28px 24px; box-shadow: 0 -20px 60px -30px rgba(0,0,0,.5); color: var(--text); }
.ribbon-strip .cap { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.ribbon-strip .imgs { display: flex; flex-wrap: wrap; gap: 4px; overflow-x: auto; }
.ribbon-strip img { height: 104px; width: auto; display: block; }

/* cards */
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px; box-shadow: var(--shadow); }
.card h3 { margin: 14px 0 6px; font-size: 19px; }
.card p { margin: 0; color: var(--muted); }
.ico { width: 46px; height: 46px; border-radius: 12px; background: var(--navy); display: grid; place-items: center; }
.ico svg { width: 26px; height: 26px; stroke: var(--amber); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* commands */
.cmd { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; margin-bottom: 72px; }
.cmd:last-child { margin-bottom: 0; }
.cmd:nth-child(even) .txt { order: 2; }
.cmd h3 { font-size: 30px; margin: 0 0 4px; }
.cmd .en { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.cmd ul { padding: 0; margin: 18px 0 24px; list-style: none; }
.cmd li { padding-left: 28px; position: relative; margin-bottom: 8px; }
.cmd li::before { content: ""; position: absolute; left: 0; top: .5em; width: 14px; height: 4px; border-radius: 2px; background: var(--amber); }
.cmd .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cmd .btns span { color: var(--muted); font-size: 14px; margin-right: 4px; }
.shot { background: var(--navy); border-radius: 18px; padding: 28px; color: #fff; box-shadow: var(--shadow); min-height: 240px; display: grid; place-items: center; }
@media (max-width: 860px) { .cmd { grid-template-columns: 1fr; gap: 24px; } .cmd:nth-child(even) .txt { order: 0; } }

/* videos */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.tabs button { background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 7px 16px; border-radius: 99px; font: inherit; font-size: 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }
.vid { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.vid .screen { position: relative; aspect-ratio: 16/9; background: #0f1a33; display: grid; place-items: center; overflow: hidden; }
.vid video { width: 100%; height: 100%; display: block; background: #000; }
.vid .ph { position: absolute; inset: 0; background-image: linear-gradient(rgba(91,182,232,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(91,182,232,.12) 1px, transparent 1px); background-size: 28px 28px; display: grid; place-items: center; }
.vid .play { width: 64px; height: 64px; border-radius: 50%; background: rgba(242,169,59,.16); border: 2px solid var(--amber); display: grid; place-items: center; }
.vid .play::after { content: ""; border-left: 20px solid var(--amber); border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
.vid .soon { position: absolute; top: 12px; right: 12px; background: var(--amber); color: var(--navy); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; letter-spacing: .04em; }
.vid .tag { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #c9d3e6; background: rgba(20,33,61,.85); padding: 3px 10px; border-radius: 6px; }
.vid .body { padding: 16px 18px 20px; }
.vid h4 { margin: 0 0 4px; font-size: 17px; }
.vid p { margin: 0; color: var(--muted); font-size: 14.5px; }

/* manuals */
.man { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }
.man .card { display: flex; flex-direction: column; gap: 14px; }
.man h3 { margin: 0; }
.pdfs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.pdf { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1.5px solid var(--line); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--bg); }
.pdf:hover { border-color: var(--amber); }
.pdf svg { width: 18px; height: 18px; stroke: var(--amber); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.note { margin-top: 18px; color: var(--muted); font-size: 14.5px; }

/* install */
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; padding: 0; list-style: none; margin: 0 0 36px; }
.steps li { counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 22px 70px; position: relative; box-shadow: var(--shadow); }
.steps li::before { content: counter(s); position: absolute; left: 20px; top: 20px; width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: var(--amber); display: grid; place-items: center; font-weight: 700; }
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.dl .card .btn { margin-top: 14px; }
.req { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }

/* faq */
details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; }
summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary::after { content: "+"; color: var(--amber); font-size: 22px; line-height: 1; }
details[open] summary::after { content: "−"; }
details p { margin: 12px 0 0; color: var(--muted); }

footer { background: var(--navy); color: #c9d3e6; padding: 44px 0; font-size: 14.5px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 20px 40px; justify-content: space-between; }
footer a { color: #fff; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; } .reveal { opacity: 1; transform: none; transition: none; }
  .duct .flex, .duct .pulse { animation: none; }
}
</style>
</head>

      "foot.copy": "© 2026 Maliuhin Volodymyr. Бесплатная надстройка для Autodesk Revit.", "foot.license": "Лицензия", "foot.third": "Сторонние компоненты", "foot.releases": "Все релизы"
    }
  };

  /* ---------- ролики: заглушки; чтобы подключить видео, пропишите src (mp4 из релиза «media») ---------- */
  var VIDEOS = [
    { id: "V1", grp: "common", src: null, title: { uk: "Налаштування й «Про програму»", en: "Settings and About", ru: "Настройки и «О программе»" }, text: { uk: "Мова, колір і вигляд гофри при перегляді, перевірка оновлень.", en: "Language, preview color and look, update check.", ru: "Язык, цвет и вид гофры при просмотре, проверка обновлений." } },
    { id: "V2", grp: "qfc", src: null, title: { uk: "План, розріз і 3D", en: "Plan, section, and 3D", ru: "План, разрез и 3D" }, text: { uk: "Штатна команда на розрізі недоступна, наша — працює в кожному вигляді.", en: "The built-in command is unavailable on a section; ours works in every view.", ru: "Штатная команда на разрезе недоступна, наша — работает в каждом виде." } },
    { id: "V3", grp: "qfc", src: null, title: { uk: "Камера статичного тиску", en: "Static-pressure plenum", ru: "Камера статического давления" }, text: { uk: "Серія патрубків поспіль; вікно вибору — лише вперше.", en: "A series of taps in a row; the size window appears only once.", ru: "Серия патрубков подряд; окно выбора — только в первый раз." } },
    { id: "V4", grp: "qfc", src: null, title: { uk: "Вікно вибору розміру", en: "The size window", ru: "Окно выбора размера" }, text: { uk: "Свій діаметр — і два переходи будуються наживо.", en: "Your own diameter, and two transitions are built live.", ru: "Свой диаметр — и два перехода строятся вживую." } },
    { id: "V5", grp: "qfc", src: null, title: { uk: "Різні діаметри й елементи", en: "Different diameters and elements", ru: "Разные диаметры и элементы" }, text: { uk: "Вентилятор, дросель-клапан, розподільник — переходи ставляться самі.", en: "Fan, damper, terminal; transitions are added by themselves.", ru: "Вентилятор, дроссель-клапан, распределитель — переходы ставятся сами." } },
    { id: "V6", grp: "qfc", src: null, title: { uk: "Типи гнучкого повітроводу", en: "Flex duct types", ru: "Типы гибкого воздуховода" }, text: { uk: "Утеплений тип і режим «з зразка» в моделі.", en: "An insulated type and the “from a sample” mode.", ru: "Утеплённый тип и режим «с образца» в модели." } },
    { id: "V7", grp: "ft", src: null, title: { uk: "Будь-які категорії", en: "Any category", ru: "Любые категории" }, text: { uk: "Камера, обладнання, деталі: там, де штатна команда відмовляє.", en: "Plenum, equipment, fittings: where the built-in command refuses.", ru: "Камера, оборудование, детали: там, где штатная команда отказывает." } },
    { id: "V8", grp: "ft", src: null, title: { uk: "Довжина, «Вся ділянка», цикл", en: "Length, whole segment, loop", ru: "Длина, «Весь участок», цикл" }, text: { uk: "Швидкі значення, своя довжина, заміна ділянки цілком.", en: "Quick values, a custom length, replacing a whole segment.", ru: "Быстрые значения, своя длина, замена участка целиком." } },
    { id: "V9", grp: "common", src: null, title: { uk: "Зрозумілі повідомлення", en: "Messages that explain", ru: "Понятные сообщения" }, text: { uk: "Вікно замість помилки Revit: посилання на елемент, «Копіювати», журнал.", en: "A window instead of a Revit error: element link, Copy, log.", ru: "Окно вместо ошибки Revit: ссылка на элемент, «Копировать», журнал." } }
    /* src: "https://github.com/iMrVoLaNd/HVAC-Stuff-Releases/releases/download/media/V3.mp4"; подпись вшита в видео (en, uk, ru) */
  ];
  var GROUPS = { all: null, qfc: "qfc.name", ft: "ft.name", common: { uk: "Загальне", en: "General", ru: "Общее" } };

  var lang = "uk", filter = "all", version = "1.1.1";

  function pickLang() {
    try { var s = localStorage.getItem("hvac-lang"); if (s && T[s]) return s; } catch (e) {}
    var n = (navigator.language || "uk").slice(0, 2).toLowerCase();
    return T[n] ? n : "en";
  }
  function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }

  function scheme() {
    var f = document.documentElement.getAttribute("data-theme");
    if (f) return f;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function renderRibbon() {
    var names = ["QuickFlexConnect", "FlexTail", "Settings", "About", "rest"];
    var box = document.getElementById("ribbon"), sc = scheme();
    box.innerHTML = names.map(function (n) {
      return '<img src="ribbon/img/col-' + n + "-" + lang + "-" + (sc === "dark" ? "dark" : "light") + '.svg" alt="' + n + '" loading="lazy">';
    }).join("");
  }
  function renderPdfs() {
    document.querySelectorAll("[data-pdf]").forEach(function (el) {
      el.innerHTML = ["uk", "en", "ru"].map(function (l) {
        return '<a class="pdf" href="' + RAW + el.dataset.pdf + "-" + l + '.pdf" target="_blank" rel="noopener"><svg><use href="#i-pdf"/></svg>' + l.toUpperCase().replace("UK", "UA") + "</a>";
      }).join("");
    });
  }
  function groupLabel(g) { return g === "all" ? t("vid.all") : (typeof GROUPS[g] === "string" ? t(GROUPS[g]) : GROUPS[g][lang]); }
  function renderVideos() {
    var tabs = document.getElementById("vtabs");
    tabs.innerHTML = Object.keys(GROUPS).map(function (g) {
      return '<button data-g="' + g + '" aria-pressed="' + (g === filter) + '">' + groupLabel(g) + "</button>";
    }).join("");
    document.getElementById("vids").innerHTML = VIDEOS.filter(function (v) { return filter === "all" || v.grp === filter; }).map(function (v) {
      var screen;
      if (v.src) {
        screen = '<video controls preload="metadata" playsinline src="' + v.src + '"></video>';
      } else {
        screen = '<div class="ph"><div class="play"></div></div><span class="soon">' + t("vid.soon") + '</span><span class="tag">' + v.id + " · " + groupLabel(v.grp) + "</span>";
      }
      return '<article class="vid reveal in"><div class="screen">' + screen + '</div><div class="body"><h4>' + v.title[lang] + "</h4><p>" + v.text[lang] + "</p></div></article>";
    }).join("");
  }
  function applyLang(l) {
    lang = l;
    try { localStorage.setItem("hvac-lang", l); } catch (e) {}
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === l); });
    document.title = "HVAC Stuff — " + t("hero.eyebrow");
    renderRibbon(); renderVideos(); renderPdfs();
  }

  document.querySelectorAll(".lang button").forEach(function (b) { b.addEventListener("click", function () { applyLang(b.dataset.lang); }); });
  document.getElementById("vtabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) { filter = b.dataset.g; renderVideos(); }
  });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderRibbon);

  /* версия и прямые ссылки на MSI из последнего релиза; без сети остаётся ссылка на страницу релизов */
  function setVersion(v) {
    version = v;
    document.getElementById("ver").textContent = v;
    var u = "https://github.com/" + REPO + "/releases/download/" + v + "/HVAC.Stuff-" + v;
    document.getElementById("dl-single").href = u + "-SingleUser.msi";
    document.getElementById("dl-multi").href = u + "-MultiUser.msi";
  }
  fetch("https://api.github.com/repos/" + REPO + "/releases/latest").then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j && j.tag_name) setVersion(j.tag_name.replace(/^v/, "")); }).catch(function () {});

  applyLang(pickLang());

  /* появление блоков при прокрутке */
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: .12 }) : null;
  document.querySelectorAll(".reveal").forEach(function (el) { if (io) io.observe(el); else el.classList.add("in"); });
})();
</script>
