      "how.note": "Fill and the automatic mode work in plans, sections, elevations, 3D views and element schedules. They are off on sheets, in legends and in drafting views. The plugin does not work in a family.",
      "rules.eyebrow": "System names", "rules.title": "How a name becomes a result",

      "e1": "<b>Ducts decide before pipes:</b> a supply unit with a heater is a supply unit.",
