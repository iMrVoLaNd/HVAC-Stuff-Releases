<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#DDEEFA">
<title>Разбор имён систем</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: same look as the HVAC Stuff site (theme Aero): light-blue bar with an amber line, hero, alternating sections, side dots. */
:root {
  --bg: #F6F9FC;
  --surface: #ffffff;
  --sand: #E9F3FB;
  --line: #D0DEED;
  --ink: #0D1830;
  --muted: #5A6882;
  --amber: #F5A623;
  --amber-ink: #6B4300;
  --amber-soft: #FFF1D6;
  --sky: #38B6F0;
  --sky-soft: #DCEFFC;
  --ok: #1F7A52;
  --ok-soft: #DDF1E6;
  --warn: #9A5B00;
  --warn-soft: #FCEBC9;
  --bad: #A8322A;
  --bad-soft: #F8DDDA;
  --navy: #14213D;
  --navy-2: #1c2d52;
  --on-navy: #F8FBFE;
  --nav-bg: #DDEEFA; --nav-ink: #0D1830; --nav-muted: #3A4660; --nav-line: #B9D0E6; --nav-hover: rgba(13,24,48,.07);
  --hero-bg: radial-gradient(900px 420px at 85% 10%, rgba(56,182,240,.30), transparent 60%), linear-gradient(135deg, #D3EAFB, #FFF3DB);
  --hero-ink: #0D1830; --hero-sub: #3A4660; --chip-line: #B9D0E6; --chip-ink: #0D1830; --hero-em: #C77A00;
  --card-bg: linear-gradient(180deg, #ffffff, #F1F8FE);
  --shadow: 0 1px 2px rgba(13,24,48,.06), 0 12px 32px -12px rgba(13,24,48,.18);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080F20; --surface: #101B35; --sand: #0E1930; --line: #223360; --ink: #E8EEFB; --muted: #8F9EC0;
    --amber: #FFB93D; --sky: #4CC9FF;
    --amber-ink: #F6C778; --amber-soft: #3A2E12; --sky-soft: #14344A;
    --ok: #5CC796; --ok-soft: #153327; --warn: #F2B65A; --warn-soft: #3B2C10; --bad: #F28C82; --bad-soft: #3D1F1C;
    --navy: #0B1530;
    --nav-bg: #0B1530; --nav-ink: #fff; --nav-muted: #c9d3e6; --nav-line: #2A3F73; --nav-hover: rgba(255,255,255,.07);
    --hero-bg: radial-gradient(900px 420px at 85% 10%, rgba(76,201,255,.22), transparent 60%), linear-gradient(180deg, #0B1530, #0A1226);
    --hero-ink: #fff; --hero-sub: #c9d3e6; --chip-line: #2A3F73; --chip-ink: #c9d3e6; --hero-em: #FFB93D;
    --card-bg: linear-gradient(180deg, #14213f, #101B35);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080F20; --surface: #101B35; --sand: #0E1930; --line: #223360; --ink: #E8EEFB; --muted: #8F9EC0;
  --amber: #FFB93D; --sky: #4CC9FF;
  --amber-ink: #F6C778; --amber-soft: #3A2E12; --sky-soft: #14344A;
  --ok: #5CC796; --ok-soft: #153327; --warn: #F2B65A; --warn-soft: #3B2C10; --bad: #F28C82; --bad-soft: #3D1F1C;
  --navy: #0B1530;
  --nav-bg: #0B1530; --nav-ink: #fff; --nav-muted: #c9d3e6; --nav-line: #2A3F73; --nav-hover: rgba(255,255,255,.07);
  --hero-bg: radial-gradient(900px 420px at 85% 10%, rgba(76,201,255,.22), transparent 60%), linear-gradient(180deg, #0B1530, #0A1226);
  --hero-ink: #fff; --hero-sub: #c9d3e6; --chip-line: #2A3F73; --chip-ink: #c9d3e6; --hero-em: #FFB93D;
  --card-bg: linear-gradient(180deg, #14213f, #101B35);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
main, footer { overflow-x: clip; }
.wrap {
  max-width: 1040px;
  margin-inline: auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
/* sticky bar: always visible, the progress line is on top of it */
.progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 40; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--amber), var(--sky)); }
.nav { position: sticky; top: 0; z-index: 30; background: var(--nav-bg); border-bottom: 3px solid var(--amber); backdrop-filter: blur(10px); color: var(--nav-ink); padding-top: env(safe-area-inset-top, 0px); }
.nav .wrap { display: flex; align-items: center; gap: 22px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; font-size: 17px; white-space: nowrap; color: var(--nav-ink); }
.brand i { width: 28px; height: 28px; border-radius: 50%; background: var(--amber); color: var(--navy); display: grid; place-items: center; font: 800 14px var(--font); font-style: normal; flex: none; }
.back { color: var(--nav-muted); text-decoration: none; font-size: 14px; white-space: nowrap; border: 1.5px solid var(--nav-line); border-radius: 10px; padding: 4px 10px; }
.back:hover { color: var(--nav-ink); border-color: var(--amber); }
.links { display: flex; gap: 20px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.links::-webkit-scrollbar { display: none; }
.links a { color: var(--nav-muted); text-decoration: none; font-size: 15px; white-space: nowrap; padding: 4px 0; box-shadow: inset 0 -2px 0 transparent; transition: color .2s, box-shadow .2s; }
.links a:hover { color: var(--nav-ink); }
.links a.active { color: var(--nav-ink); box-shadow: inset 0 -2px 0 var(--amber); }
@media (max-width: 760px) { .brand span { display: none; } .nav .wrap { gap: 12px; } .links { gap: 16px; margin-left: 0; } }
.dots { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 30; display: flex; flex-direction: column; gap: 4px; padding: 8px 4px; border-radius: 99px; background: var(--nav-bg); border: 1px solid var(--nav-line); backdrop-filter: blur(6px); }
.dots a { position: relative; display: grid; place-items: center; width: 22px; height: 22px; text-decoration: none; }
.dots a::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--nav-muted); transition: transform .25s, background .25s, border-color .25s; }
.dots a:hover::before, .dots a:focus-visible::before { border-color: var(--amber); transform: scale(1.2); }
.dots a[aria-current="true"]::before { background: var(--amber); border-color: var(--amber); transform: scale(1.35); box-shadow: 0 0 0 4px rgba(242,169,59,.25); }
.dots a::after { content: attr(data-label); position: absolute; right: 34px; top: 50%; transform: translate(8px, -50%); background: var(--navy); color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.dots a:hover::after, .dots a:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
@media (max-width: 1180px) { .dots { display: none; } }

.hero { position: relative; overflow: hidden; color: var(--hero-ink); padding: 72px 0 76px; background: var(--hero-bg); }
.hero::before { content: ""; position: absolute; inset: -20% -10% auto auto; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,169,59,.2), transparent 70%); pointer-events: none; }
.hero .wrap { position: relative; }
.hero .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
@media (max-width: 860px) { .hero .grid { grid-template-columns: minmax(0, 1fr); } }
.eyebrow { color: var(--hero-em); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; margin: 0 0 10px; }
.hero h1 { font-size: clamp(36px, 5.6vw, 60px); line-height: 1.05; margin: 0 0 18px; letter-spacing: -.02em; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--hero-em); }
.hero p.sub { font-size: 19px; color: var(--hero-sub); max-width: 540px; margin: 0 0 28px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--amber); color: #4A2F00; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 10px; border: 0; box-shadow: 0 10px 24px -10px rgba(245,166,35,.8); transition: transform .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.ghost { background: transparent; color: var(--hero-ink); border: 1.5px solid var(--hero-ink); box-shadow: none; }
.meta { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
.chipm { font-size: 13px; padding: 4px 12px; border-radius: 99px; border: 1.5px solid var(--chip-line); color: var(--chip-ink); }
.chipm b { color: var(--hero-em); }
.hero-card { background: var(--card-bg); border: 1.5px solid var(--line); color: var(--ink); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero-card h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero-card .sum { color: var(--muted); font-size: 14px; margin: 0; }
.hero-card .eqname { font-size: 20px; font-weight: 700; margin: 0; }

section { padding-block: 72px; }
section.alt { background: var(--sand); }
.band > .wrap > .badge + .lead, .band > .wrap > .lead { margin-top: 0; }
h2 { margin: 0 0 14px; font-size: clamp(26px, 3.6vw, 36px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h2::after { content: ""; display: block; height: 4px; width: 56px; border-radius: 2px; margin-top: 12px; background: var(--amber); }
h2.sub2 { font-size: 22px; margin-top: 40px; }
h2.sub2::after { display: none; }
.lead { margin: 0 0 32px; color: var(--muted); font-size: 17px; max-width: 70ch; }
code, .mono { font-family: var(--mono); }

/* token chips: one colour per part of a name */
.parts { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.part { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.part b {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 17px;
  line-height: 1;
  padding: 0 10px;
  border-radius: 6px;
  border: 2px solid transparent;
  height: 34px;
  min-height: 34px;
  max-height: 34px;
  min-width: 34px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: pre;
  overflow: hidden;
}
.part { flex: none; }
.parts { align-items: flex-start; }
.parts > .arrow { height: 34px; display: flex; align-items: center; align-self: flex-start; }
.part small { line-height: 1.2; text-align: center; min-height: 14px; }
.part small { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.t-prefix b { background: var(--navy); color: var(--on-navy); border-color: #3a4a72; }
.t-sep b { background: transparent; color: var(--muted); border-style: dashed; border-color: var(--muted); font-family: var(--font); font-weight: 400; padding: 0 9px; }
.t-num b { background: var(--amber); color: #2A1A00; border-color: var(--amber); }
.t-letter b { background: var(--sky); color: #06222F; border-color: var(--sky); }
.t-rest b { background: transparent; color: var(--muted); border-style: dashed; border-color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.arrow { align-self: center; color: var(--muted); font-size: 20px; padding-inline: 4px; }
.t-out b { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); font-size: 18px; padding: 0 8px; }
.t-out.bad b { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.t-out.warn b { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }

/* flow */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.step {
  background: var(--card-bg);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  min-width: 0;
  box-shadow: var(--shadow);
  transition: transform .3s, border-color .3s;
}
.step:hover { transform: translateY(-4px); border-color: var(--amber); }
.step h3 { margin: 0 0 6px; font-size: 17px; }
.step p { margin: 0; color: var(--muted); font-size: 14px; }
.step .ex { margin-top: 8px; font-family: var(--mono); font-size: 13px; color: var(--ink); overflow-wrap: anywhere; }

/* tester */
.panel { background: var(--card-bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 640px) { .row { grid-template-columns: minmax(0, 1fr); } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
select, input[type=text] {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  min-width: 0;
  width: 100%;
  text-transform: none;
  letter-spacing: 0;
}
input[type=text] { font-family: var(--mono); font-size: 17px; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--sky); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font-family: var(--mono);
  font-size: 13px;
  background: var(--sand);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  cursor: pointer;
}
.chip.text { font-family: var(--font); }
.chip:hover { border-color: var(--amber); }
.result { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; width: fit-content; max-width: 100%;
}
.s-ok { background: var(--ok-soft); color: var(--ok); }
.s-warn { background: var(--warn-soft); color: var(--warn); }
.s-bad { background: var(--bad-soft); color: var(--bad); }
.s-note { background: var(--sky-soft); color: var(--ink); }
.keydots { font-family: var(--mono); letter-spacing: 1px; color: var(--amber-ink); white-space: nowrap; }
.gtag { display: inline-block; border: 1.5px solid var(--ink); border-radius: 7px; padding: 1px 8px; font-weight: 700; font-size: 13px; }
.sortgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .sortgrid { grid-template-columns: 1fr; } }
.sortbtns { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; }
.sortbtns button { font: inherit; font-weight: 600; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 14px; }
.sortbtns button:disabled { opacity: .45; cursor: default; }
.sortbtns button:hover:not(:disabled) { background: var(--sand); }
.sepgroup td { border-top: 2px solid var(--line); }
.note { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* tables */
.scroll { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: var(--sand); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.m { font-family: var(--mono); white-space: nowrap; }
td.ok { color: var(--ok); font-weight: 700; }
td.no { color: var(--bad); font-weight: 700; }
td.wrap { white-space: normal; min-width: 220px; }
.pill { font-family: var(--mono); font-size: 13px; background: var(--sand); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.score { display: inline-block; margin: 0 0 10px; padding: 4px 12px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.score.bad { background: var(--bad-soft); color: var(--bad); }
.group { margin-top: 22px; }
.group h3 { margin: 0 0 4px; font-size: 16px; }
.group p { margin: 0 0 10px; color: var(--muted); font-size: 14px; max-width: 72ch; }
.kind { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 5px; font-weight: 600; white-space: nowrap; }
.kind.duct { background: var(--sky-soft); color: var(--ink); }
.kind.pipe { background: var(--amber-soft); color: var(--amber-ink); }

ul.tight { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 99px; background: var(--amber); color: var(--navy); letter-spacing: .04em; margin-bottom: 14px; }

/* equipment */
.rules { counter-reset: r; display: grid; gap: 12px; margin: 0 0 28px; padding: 0; list-style: none; max-width: 82ch; }
.rules li { counter-increment: r; background: var(--card-bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 56px; position: relative; font-size: 15px; box-shadow: var(--shadow); }
.rules li::before { content: counter(r); position: absolute; left: 14px; top: 13px; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--amber); border: 2px solid var(--amber); font: 700 14px/26px var(--font); text-align: center; }
.rules b { font-weight: 600; }
.conn { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto; gap: 8px; margin-bottom: 8px; align-items: end; }
@media (max-width: 640px) { .conn { grid-template-columns: minmax(0, 1fr); } }
button.b {
  font: inherit; font-size: 13px; font-weight: 600; border-radius: 7px; padding: 9px 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
}
button.b.main { background: var(--amber); color: #2A1A00; border-color: var(--amber); }
button.b:hover { filter: brightness(.96); }
.verdict td { vertical-align: top; }
.eqclass { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-radius: 12px; background: var(--sky-soft); border: 1.5px solid var(--line); color: var(--ink); }
.eqclass small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-ink); font-weight: 700; }
.eqclass b { font-size: 19px; }
.conflict { border: 2px solid var(--warn); background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.conflict h4 { margin: 0; font-size: 16px; color: var(--warn); }
.conflict p { margin: 0; font-size: 14.5px; }
.conflict .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.saved { font-size: 14px; color: var(--ok); font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.role { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 5px; white-space: nowrap; }
.role.use { background: var(--ok-soft); color: var(--ok); }
.role.skip { background: var(--sand); color: var(--muted); }
.role.unk { background: var(--warn-soft); color: var(--warn); }
.warns { margin: 0; padding-left: 18px; color: var(--warn); font-size: 14px; }
footer { background: var(--nav-bg); border-top: 3px solid var(--amber); color: var(--nav-muted); padding: 40px 0; font-size: 14.5px; }
footer a { color: var(--nav-ink); }

.lang { display: flex; border: 1.5px solid var(--nav-line); border-radius: 10px; overflow: hidden; flex: none; }
.lang button { background: none; border: 0; color: var(--nav-muted); padding: 5px 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.lang button:hover { color: var(--nav-ink); }
.lang button[aria-pressed="true"] { background: var(--amber); color: #14213D; }
.lang button:focus-visible, .themebtn:focus-visible { outline: 3px solid var(--sky); outline-offset: 1px; }
.themebtn { flex: none; width: 36px; height: 30px; border: 1.5px solid var(--nav-line); border-radius: 10px; background: none; color: var(--nav-muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.themebtn:hover { color: var(--nav-ink); border-color: var(--amber); }

L('how.b5',

  '<b>Тип без правила</b> (чужі назви типів) і порожнє «Ім’я починається з» дають транзит: ім’я переноситься як є. Той самий транзит отримують імена, які не підійшли правилу свого типу.',
  '<b>A type without a rule</b> (foreign type names) and an empty “Name starts with” give transit: the name is copied as is. Names that do not fit the rule of their type get the same transit.');

L('how.b6',
  '<b>Проблема и замечание — разные вещи.</b> Проблема — имя, которое нельзя прочитать (пустое, не те буквы, нет числа, нет точки у линий): оно переносится как есть, значок просит внимания, имя попадает в список проверки. <b>Замечание</b> — имя читается и результат записан, но написано нестандартно («П 1», «ПВ (п) 1»): значок внимания не просит, такие имена перечислены в отчёте и журнале, исправьте их, когда удобно. Стандартная форма: <span class="pill">П1</span>, <span class="pill">ПВ1</span>.',
  '<b>Проблема й зауваження — різні речі.</b> Проблема — ім’я, яке не можна прочитати (порожнє, не ті літери, немає числа, немає крапки в ліній): воно переноситься як є, значок просить уваги, ім’я потрапляє до списку перевірки. <b>Зауваження</b> — ім’я читається й результат записано, але написано нестандартно («П 1», «ПВ (п) 1»): значок уваги не просить, такі імена перелічено у звіті й журналі, виправте їх, коли буде зручно. Стандартна форма: <span class="pill">П1</span>, <span class="pill">ПВ1</span>.',
  '<b>A problem and a notice are different things.</b> A problem is a name that cannot be read (empty, wrong letters, no number, no dot for the lines): it is copied as is, the icon asks for attention, and the name goes to the list to check. A <b>notice</b> is a name that is read and the result is written, but it is written in a non-standard form (“П 1”, “ПВ (п) 1”): the icon does not ask for attention, such names are listed in the report and the log, fix them when convenient. The standard form: <span class="pill">П1</span>, <span class="pill">ПВ1</span>.');

L('eq.title', 'Оборудование', 'Обладнання', 'Equipment');
L('eq.badge', 'Описание логики. В плагине правила для оборудования пока не включены', 'Опис логіки. У плагіні правила для обладнання поки не ввімкнено', 'A description of the logic. The plug-in does not have the rules for equipment yet');
L('eq.lead',
  'К одному оборудованию в Revit подключают сразу несколько систем, поэтому у него в имени системы список через запятую, например «ПК-1, РК-1». По набору подключённых систем надо понять, что это за оборудование, и собрать одно имя для спецификации.',
  'До одного обладнання в Revit підключають одразу кілька систем, тому в нього в імені системи список через кому, наприклад «ПК-1, РК-1». За набором підключених систем треба зрозуміти, що це за обладнання, і зібрати одне ім’я для специфікації.',
  'Several systems are connected to one piece of equipment in Revit at once, so its system name is a comma-separated list, for example “ПК-1, РК-1”. From the set of connected systems we must tell what the equipment is and build one name for the schedule.');
L('eq.r1',
  '<b>Вентиляция главнее труб.</b> Если подключена хоть одна система воздуховодов, класс оборудования определяют только они. Трубы (теплоснабжение, холод, дренаж) второстепенные: к приточной установке может быть подключён нагреватель, к воздушной завесе горячая вода.',
  '<b>Вентиляція важливіша за труби.</b> Якщо підключена хоча б одна система повітропроводів, клас обладнання визначають лише вони. Труби (теплопостачання, холод, дренаж) другорядні: до припливної установки може бути підключений нагрівач, до повітряної завіси гаряча вода.',
  '<b>Ventilation outranks pipes.</b> If at least one duct system is connected, only the ducts decide the class of the equipment. Pipes (heat supply, cooling, drainage) are secondary: a heater can be connected to a supply unit, hot water to an air curtain.');
L('eq.r2',
  '<b>Системы воздуховодов у одного оборудования должны быть одного класса.</b> Вместе могут быть только типы 03 и 04 (ПВ: приток и вытяжка, сколько угодно штук, хоть четыре) и типы 05 и 06 (ПК и РК канального кондиционера, обе или одна). Всё остальное вместе быть не может: например, ПВ1 (п), ПВ1 (в) и П1.',
  '<b>Системи повітропроводів в одного обладнання мають бути одного класу.</b> Разом можуть бути лише типи 03 і 04 (ПВ: приплив і витяжка, скільки завгодно штук, хоч чотири) та типи 05 і 06 (ПК і РК канального кондиціонера, обидві або одна). Решта разом бути не може: наприклад, ПВ1 (п), ПВ1 (в) і П1.',
  '<b>The duct systems of one piece of equipment must be of one class.</b> Only types 03 and 04 can be together (ПВ: supply and exhaust, any number, even four) and types 05 and 06 (ПК and РК of a duct air conditioner, both or one). Anything else cannot be together: for example, ПВ1 (п), ПВ1 (в) and П1.');
L('eq.r3',
  '<b>Если подключены несовместимые системы,</b> плагин не молчит. Он пишет: «К оборудованию подключено несколько вентиляционных систем, которые не бывают вместе», и предлагает два пути: исправить подключение в модели (убрать лишнее) или выбрать, какая система главная. Пока выбора нет, главной считается та, что выше в списке типов (П, потом В, потом ПВ и так далее), и оборудование отмечено как «требует проверки».',
  '<b>Якщо підключені несумісні системи,</b> плагін не мовчить. Він пише: «До обладнання підключено кілька вентиляційних систем, які не бувають разом», і пропонує два шляхи: виправити підключення в моделі (прибрати зайве) або обрати, яка система головна. Поки вибору немає, головною вважається та, що вище в списку типів (П, потім В, потім ПВ і так далі), а обладнання позначене як «потребує перевірки».',
  '<b>If incompatible systems are connected,</b> the plug-in does not stay silent. It says: “Several ventilation systems that cannot be together are connected to the equipment”, and offers two ways: fix the connection in the model (remove the extra one) or choose which system is the main one. Until you choose, the main one is the one higher in the list of types (П, then В, then ПВ and so on), and the equipment is marked “needs a check”.');
L('eq.r4',
  '<b>Ваш выбор запоминается в проекте</b>, как и «Оставить как есть» для имён. Он относится к этому сочетанию систем (типы и имена), а другое сочетание проверится заново.',
  '<b>Ваш вибір запам’ятовується в проєкті</b>, як і «Залишити як є» для імен. Він стосується цього поєднання систем (типи та імена), а інше поєднання перевіриться заново.',
  '<b>Your choice is remembered in the project</b>, like “Keep as is” for names. It applies to this combination of systems (types and names); another combination is checked again.');
L('eq.r5',
  '<b>Решает тип системы, а не буква в имени.</b> Так «ПП» воздуховода (естественный приток) и «ПП» трубы (подпор воздуха) не путаются, а «К» канального кондиционера не путается с «К1» канализации.',
  '<b>Вирішує тип системи, а не літера в імені.</b> Так «ПП» повітропроводу (природний приплив) і «ПП» труби (підпір повітря) не плутаються, а «К» канального кондиціонера не плутається з «К1» каналізації.',
  '<b>The system type decides, not a letter in the name.</b> So “ПП” of a duct (natural supply) and “ПП” of a pipe (air pressurization) are not mixed up, and “К” of a duct air conditioner is not mixed up with “К1” of sewage.');
L('eq.r6',
  '<b>Если воздуховодов нет, класс определяют трубы,</b> по порядку в списке типов: кондиционирование (Х3–Х5), дренаж, фреоновый холод (ВО3–ВО5), теплоснабжение, электроконвектор, радиаторное отопление, водяной холод, подпор воздуха. Бытовая канализация К1 самая слабая: если рядом есть другая система, она игнорируется с предупреждением (скорее всего, вместо дренажа выбрали не ту систему).',
  '<b>Якщо повітропроводів немає, клас визначають труби,</b> за порядком у списку типів: кондиціонування (Х3–Х5), дренаж, фреоновий холод (ВО3–ВО5), теплопостачання, електроконвектор, радіаторне опалення, водяний холод, підпір повітря. Побутова каналізація К1 найслабша: якщо поруч є інша система, вона ігнорується з попередженням (найімовірніше, замість дренажу обрали не ту систему).',
  '<b>If there are no ducts, the pipes decide the class,</b> in the order of the list of types: air conditioning (Х3–Х5), drainage, refrigerant cooling (ВО3–ВО5), heat supply, electric convector, radiator heating, water cooling, air pressurization. Domestic sewage К1 is the weakest: if another system is next to it, it is ignored with a warning (most likely the wrong system was chosen instead of drainage).');

// ===== language, theme, link parameters =====
const params = new URLSearchParams(location.search);
function pickLang() {
  const q = (params.get('lang') || '').slice(0, 2).toLowerCase();
  if (T[q]) return q;
  try { const s = localStorage.getItem('hvac-lang'); if (s && T[s]) return s; } catch (e) { /* storage may be unavailable */ }
  const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return T[n] ? n : 'en';
}
let lang = pickLang();
function t(key, ...args) {
  let v = (T[lang] && T[lang][key]) ?? T.ru[key] ?? key;
  args.forEach((a, i) => { v = v.split('{' + i + '}').join(a); });
  return v;
}
function applyStatic(root) {
  root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  root.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
}

function effectiveTheme() {
  const f = document.documentElement.getAttribute('data-theme');
  if (f) return f;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function paintThemeButton() { document.getElementById('themeBtn').dataset.eff = effectiveTheme(); }
function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  try { localStorage.setItem('hvac-theme', th); } catch (e) { /* storage may be unavailable */ }
  paintThemeButton();
}
try { const saved = localStorage.getItem('hvac-theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved); } catch (e) { /* storage may be unavailable */ }
document.getElementById('themeBtn').addEventListener('click', () => setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButton);
paintThemeButton();

const LOOK = { A:'А', a:'а', B:'В', C:'С', c:'с', E:'Е', e:'е', H:'Н', I:'І', i:'і', K:'К', k:'к', M:'М', O:'О', o:'о', P:'Р', p:'р', T:'Т', X:'Х', x:'х', Y:'У', y:'у' };
const LETTER = 'A-Za-zА-Яа-яІіЇїЄєҐґ';
const reLetter = new RegExp('^[' + LETTER + '](?![' + LETTER + '])');
const reStartsLetter = new RegExp('^[' + LETTER + ']');

function norm(s) {
  let r = '';
  for (const ch of String(s).replace(/[​-‏⁠﻿]/g, '')) r += LOOK[ch] || ch;
  return r.replace(/(х|во)з/gi, (m, a) => a + '3');
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

function parse(rawName, rule) {
  const s = norm(String(rawName)).trim();
  if (rule.g === 'sewer') return { status:'fixed', result:'К1', parts:[{ k:'out', t:'К1', l:'part.always' }] };
  // Not matching the rule: transit, the name is copied as it is.
  const transit = (status) => ({ status, result: String(rawName), transit: true, hint: suggest(s, rule) });
  if (!s) return transit('empty');
  const up = s.toUpperCase();
  const prefix = [...rule.accept].sort((a, b) => b.length - a.length).find(p => up.startsWith(p));
  if (!prefix) return transit('mismatch');
  const rest0 = s.slice(prefix.length);
  if (reStartsLetter.test(rest0)) return transit('mismatch');
  // A mark in brackets right after the letters («ПВ (п) 1») is not part of the number.
  const markM = new RegExp('^\\s*\\(\\s*[' + LETTER + ']{1,3}\\s*\\)').exec(rest0);
  const rest = markM ? rest0.slice(markM[0].length) : rest0;
  const m = /^([\s.\-]*)(\d+)/.exec(rest);
  if (!m) return transit('nonumber');
  const sep = m[1], num = m[2];
  if (rule.g === 'line' && !sep.includes('.')) return transit('needdot');
  let tail = rest.slice(m[0].length);
  const lm = reLetter.exec(tail);
  const letter = lm ? lm[0] : '';
  tail = tail.slice(letter.length);
  const hyphen = sep.includes('-') ? '-' : '';
  const parts = [{ k:'prefix', t:prefix, l:'part.type' }];
  if (markM) parts.push({ k:'rest', t:markM[0].trim(), l:'part.mark' });
  parts.push({ k:'sep', t:sep || '∅', l:'part.sep' }, { k:'num', t:num, l:'part.num' });
  if (letter) parts.push({ k:'letter', t:letter, l:'part.letter' });
  if (tail.trim()) parts.push({ k:'rest', t:tail, l:'part.rest' });
  // Read and written, but not in the standard form: a space between the letters and the number, or a mark in brackets before the number.
  const loose = Boolean(markM) || /\s/.test(sep);
  return { status: loose ? 'loose' : 'ok', result: rule.out + hyphen + num + letter, letter, parts, hint: loose ? suggest(s, rule) : undefined };
}

function suggest(s, rule) {
  const up = s.toUpperCase();
  const own = rule.accept.find(p => up.startsWith(p));
  const base = own ? s.slice(own.length) : s;
  const other = RULES.find(r => r !== rule && r.g !== 'sewer' && r.accept.some(p => up.startsWith(p) && !reStartsLetter.test(s.slice(p.length))));
  const m = /(-?)(\d+)/.exec(base);
  let fix = null;
  if (m && !(rule.g === 'line' && other)) {
    const lm = reLetter.exec(base.slice(m.index + m[0].length));
    const l = lm ? lm[0] : '';
    fix = rule.accept[0] + (rule.g === 'line' ? '.' + m[2] : m[1] + m[2] + l);
    const mark = /\([^()]*\)/.exec(s);
    if (mark) fix += ' ' + mark[0];
  }
  return { fix, other: other ? other.type : null };
}

function partsHtml(parts) {

}
function outHtml(res) {
  return '<span class="arrow">→</span><div class="part t-out"><b>' + esc(res) + '</b><small>' + t('part.write') + '</small></div>';
}
function hintText(h) {
  if (!h) return '';

  if (h.fix) r += t('hint.fix', esc(h.fix)) + ' ';
  if (h.other) r += t('hint.other', esc(h.other));

}
function statusInfo(r, rule) {
  switch (r.status) {
    case 'ok': return { cls:'s-ok', text:t('st.ok'), note:'' };
    case 'fixed': return { cls:'s-ok', text:t('st.fixed'), note:t('st.fixed.n') };
    case 'empty': return { cls:'s-warn', text:t('st.empty'), note:t('st.empty.n') };
    case 'nonumber': return { cls:'s-warn', text:t('st.nonum'), note:t('st.nonum.n', esc(rule.accept[0])) + ' ' + hintText(r.hint) };
    case 'loose': return { cls:'s-note', text:t('st.loose'), note:t('st.loose.n', esc((r.hint && r.hint.fix) || rule.accept[0] + '1')) };
    case 'needdot': return { cls:'s-warn', text:t('st.dot', esc(rule.accept[0])), note:t('st.dot.n') + ' ' + hintText(r.hint) };
    default: return { cls:'s-bad', text:t('st.mismatch'), note:t('st.mismatch.n', esc(rule.accept.join('» / «'))) + ' ' + hintText(r.hint) };

}
function renderResult(rule, raw) {

const SORT_ROWS_INIT = [
  { type: 'ADSK_01_П_Приплив', names: ['П10', 'П2'] },
  { type: 'ADSK_03_ПВ_Приплив', names: ['ПВ (п) 2'] },
  { type: 'ADSK_04_ПВ_Витяжка', names: ['ПВ (в) 10'] },
  { type: 'ADSK_05_К_Подача_ПК', names: ['ПК2', 'ПК10'] },

  { type: 'ADSK_01_К_Кондиціонування_Х3', names: ['Х3.1'] },
  { type: 'ADSK_15_К1_Каналізація побутова', names: ['Бытовая 1'] }
];
let sortRows = SORT_ROWS_INIT.slice();
let sortGroup = {};          // type -> group number
let sortPicked = new Set();  // types ticked in the table
let sortSeq = 0;
function sortBlock() {
  const ids = new Set([...sortPicked].map(x => sortGroup[x]).filter(Boolean));
  return sortRows.filter(r => sortPicked.has(r.type) || (sortGroup[r.type] && ids.has(sortGroup[r.type])));
}
function sortMerge() {
  if (sortPicked.size < 2) return;
  const block = sortBlock();
  const id = [...sortPicked].map(x => sortGroup[x]).find(Boolean) || ++sortSeq;
  block.forEach(r => { sortGroup[r.type] = id; });
  // The group stands at the place of its top row, like in the plug-in.
  const first = sortRows.findIndex(r => block.includes(r));
  const before = sortRows.slice(0, first).filter(r => !block.includes(r)).length;
  const rest = sortRows.filter(r => !block.includes(r));
  rest.splice(before, 0, ...sortRows.filter(r => block.includes(r)));
  sortRows = rest;
  sortPicked.clear();
  renderSort();
}
function natural(a, b) { return a.localeCompare(b, undefined, { numeric: true }); }
function renderSort() {
  // Ranks as the plug-in counts them: by the order of the table; a group shares the rank of its first row, a type outside a group has its own.
  const rankByKey = {};
  let next = 0;
  const rank = {};
  for (const row of sortRows) {
    const key = sortGroup[row.type] ? 'g' + sortGroup[row.type] : 't' + row.type;
    if (!(key in rankByKey)) rankByKey[key] = next++;
    rank[row.type] = rankByKey[key];
  }
  const letter = id => String.fromCharCode(64 + id);
  let h = '<thead><tr><th>' + t('sk.th.pick') + '</th><th>' + t('th.sys') + '</th><th>' + t('th.wait') + '</th><th>' + t('sk.th.group') + '</th><th>' + t('sk.th.marks') + '</th></tr></thead><tbody>';
  for (const row of sortRows) {
    const rule = byType[row.type];
    const g = sortGroup[row.type];
    h += '<tr><td><input type="checkbox" data-t="' + esc(row.type) + '"' + (sortPicked.has(row.type) ? ' checked' : '') + '></td><td class="m">' + esc(row.type) + '</td><td><span class="pill">' + esc(rule.accept[0]) + ' → ' + esc(rule.out) + '</span></td><td>' + (g ? '<span class="gtag">' + letter(g) + '</span>' : '—') + '</td><td><span class="keydots">' + '●'.repeat(rank[row.type] + 1) + '</span></td></tr>';
  }
  document.getElementById('sortTypes').innerHTML = h + '</tbody>';
  const items = [];
  for (const row of sortRows) for (const name of row.names) items.push({ row, name, res: parse(name, byType[row.type]).result, rank: rank[row.type] });
  items.sort((a, b) => a.rank - b.rank || natural(a.res, b.res));
  let r = '<thead><tr><th>' + t('sk.th.key') + '</th><th>' + t('sk.th.name') + '</th><th>' + t('th.wait') + '</th></tr></thead><tbody>';
  let prev = -1;
  for (const it of items) {
    r += '<tr' + (prev >= 0 && it.rank !== prev ? ' class="sepgroup"' : '') + '><td class="m"><span class="keydots">' + '●'.repeat(it.rank + 1) + '</span> <b>' + esc(it.res) + '</b></td><td class="m">' + esc(it.name) + ' → ' + esc(it.res) + '</td><td class="m">' + esc(byType[it.row.type].accept[0]) + '</td></tr>';
    prev = it.rank;
  }
  document.getElementById('sortResult').innerHTML = r + '</tbody>';
  document.getElementById('skMerge').disabled = sortPicked.size < 2;
}
document.getElementById('sortTypes').addEventListener('change', e => {
  const c = e.target.closest('input[type=checkbox]');
  if (!c) return;
  if (c.checked) sortPicked.add(c.dataset.t); else sortPicked.delete(c.dataset.t);
  renderSort();
});
document.getElementById('skMerge').addEventListener('click', sortMerge);
document.getElementById('skReset').addEventListener('click', () => { sortRows = SORT_ROWS_INIT.slice(); sortGroup = {}; sortPicked.clear(); sortSeq = 0; renderSort(); });
document.getElementById('skExample').addEventListener('click', () => {
  sortRows = SORT_ROWS_INIT.slice(); sortGroup = {}; sortSeq = 0;
  sortPicked = new Set(['ADSK_05_К_Подача_ПК', 'ADSK_06_К_Забір_РК', 'ADSK_01_К_Кондиціонування_Х3']);

const choices = {};
function signature(conns) { return conns.map(c => c.type + '|' + norm(c.name).trim()).sort().join(';'); }

// conns: [{ type, name }]. Returns the class, the written name and what happened to every connected system.
// Texts are keys, so the result can be drawn again in another language.
function equip(conns) {
  const rows = conns.map(c => ({ conn: c, rule: byType[c.type] || null, role: '', note: null }));
  const known = rows.filter(r => r.rule);
  for (const r of rows) if (!r.rule) { r.role = 'unk'; r.note = ['eq.n.unk']; }
  const names = conns.map(c => c.name).filter(n => n !== '').join(', ');
  if (conns.length === 0) return { status:'empty', result:'', cls:null, rows, warns:[], present:[] };
  if (known.length === 0) return { status:'transit', result:names, cls:null, rows, warns:[], present:[] };

  const warns = [];
  let pool = known;
  // Sewage is the weakest: it decides only when nothing else is connected.
  const withoutSewer = known.filter(r => r.rule.cls !== 'К1');
  if (withoutSewer.length > 0 && withoutSewer.length < known.length) {
    for (const r of known) if (r.rule.cls === 'К1') { r.role = 'skip'; r.note = ['eq.n.sewer']; }
    warns.push(['eq.w.sewer']);
    pool = withoutSewer;
  }
  const ducts = pool.filter(r => r.rule.k === 'duct');
  const candidates = ducts.length > 0 ? ducts : pool;
  const present = [...new Set(candidates.map(r => r.rule.cls))].sort((a, b) => classOrder[a] - classOrder[b]);
  // Several classes of ducts cannot be connected to one equipment: the first in the list is the main one until the user chooses.
  const incompatible = ducts.length > 0 && present.length > 1;
  const sig = signature(conns);
  const chosen = incompatible && choices[sig] && present.includes(choices[sig]) ? choices[sig] : null;
  const clsId = chosen || present[0];
  const cls = classById[clsId];
  if (incompatible) warns.push(['eq.w.incompat', present]);

  const used = [];
  for (const r of candidates) {
    if (r.rule.cls === clsId) { r.role = 'use'; used.push(r); }
    else if (incompatible) { r.role = 'skip'; r.note = ['eq.n.incompat']; }
  }
  for (const r of pool) if (!r.role) { r.role = 'skip'; r.note = [r.rule.k === 'pipe' && ducts.length > 0 ? 'eq.n.pipe' : 'eq.n.lower']; }

  // each used system by the rule of its own type; the marks of supply and exhaust of the ПВ class are not part of the name
  const results = [];
  let bad = false;
  for (const r of used) {
    const p = parse(r.conn.name, r.rule);
    r.parsed = p;
    if (p.transit) { bad = true; r.note = ['eq.n.nofit']; continue; }
    let res = p.result;
    if (clsId === 'ПВ' && p.letter) {
      const mark = r.rule.n === 3 ? 'П' : 'В';
      if (p.letter.toUpperCase() === mark) { res = res.slice(0, res.length - p.letter.length); r.note = ['eq.n.mark', p.letter]; }
    }
    r.res = res;
    results.push(res);
  }
  const usedNames = used.map(r => r.conn.name).filter(n => n !== '').join(', ');
  const base = { cls, rows, warns, incompatible, present, sig, chosen };
  if (bad) return { ...base, status:'bad', result:usedNames };
  const distinct = [...new Set(results)];
  if (distinct.length > 1) return { ...base, status:'conflict', result:distinct.join(', ') };
  return { ...base, status: incompatible && !chosen ? 'incompat' : 'ok', result:distinct[0] };
}

function renderEquip(e) {
  const stCls = { ok:'s-ok', incompat:'s-bad', conflict:'s-warn', bad:'s-bad', transit:'s-ok', empty:'s-warn' }[e.status];
  let h = '<span class="status ' + stCls + '">' + t('eq.st.' + e.status) + '</span>';
  if (e.cls) h += '<div class="eqclass"><small>' + t('eq.det') + '</small><b>' + esc(clsTitle(e.cls.id)) + '</b></div>';
  const kind = e.status === 'ok' ? '' : e.status === 'conflict' || e.status === 'incompat' ? ' warn' : ' bad';
  const cap = e.status === 'ok' ? t('part.write') : e.status === 'incompat' ? t('part.prio') : t('part.asis');
  h += '<div class="parts"><div class="part t-out' + kind + '"><b>' + esc(e.result === '' ? t('empty') : e.result) + '</b><small>' + cap + '</small></div></div>';
  if (e.incompatible) {
    if (e.chosen) {
      h += '<div class="saved"><span>' + esc(t('eq.saved', clsTitle(e.chosen))) + '</span><button type="button" class="b" data-act="reset">' + t('eq.reset') + '</button></div>';
    } else {
      h += '<div class="conflict" role="alert"><h4>' + t('eq.check') + '</h4><p>' + esc(warnText(e.warns.find(w => w[0] === 'eq.w.incompat'))) + ' ' + t('eq.check.p') + '</p><div class="btns">' +
        e.present.map(id => '<button type="button" class="b' + (id === e.cls.id ? ' main' : '') + '" data-act="choose" data-cls="' + esc(id) + '">' + esc(t('eq.main', clsTitle(id))) + '</button>').join('') + '</div></div>';
    }
    const other = e.warns.filter(w => w[0] !== 'eq.w.incompat');
    if (other.length) h += '<ul class="warns">' + other.map(w => '<li>' + esc(warnText(w)) + '</li>').join('') + '</ul>';
  } else if (e.warns.length) {
    h += '<ul class="warns">' + e.warns.map(w => '<li>' + esc(warnText(w)) + '</li>').join('') + '</ul>';

  if (e.status === 'conflict') h += '<p class="note">' + t('eq.conf.n') + '</p>';
  if (e.status === 'bad') h += '<p class="note">' + t('eq.bad.n') + '</p>';

  }
  return h;
}

EQ_CASES.forEach((c, i) => L('case.' + i, c[0], c[1], c[2]));
function renderEqExamples() {
  let rows = '', total = 0, good = 0;
  EQ_CASES.forEach((c, i) => {
    const [, , , conns, want, wantCls] = c;
    const e = equip(conns.map(([type, name]) => ({ type, name })));
    const gotCls = e.cls ? e.cls.id : null;
    const ok = e.result === want && gotCls === wantCls;
    total++; if (ok) good++;
    const list = conns.map(([ty, n]) => '<span class="pill" title="' + esc(ty) + '">' + esc(n) + '</span>').join(' ');
    rows += '<tr><td class="wrap">' + esc(t('case.' + i)) + '</td><td class="wrap">' + list + '</td><td class="wrap">' + (e.cls ? esc(clsTitle(e.cls.id)) : '—') + '</td><td class="m">' + esc(want) + '</td><td class="m">' + esc(e.result) + '</td><td class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : '✗') + '</td></tr>';
  });
  document.getElementById('eqScore').innerHTML = '<span class="score' + (good === total ? '' : ' bad') + '">' + t('score', good, total) + '</span>';
  document.getElementById('eqTable').innerHTML = '<thead><tr><th>' + t('eq.th.eq') + '</th><th>' + t('eq.th.conn') + '</th><th>' + t('eq.th.cls') + '</th><th>' + t('th.expect') + '</th><th>' + t('th.got') + '</th><th></th></tr></thead><tbody>' + rows + '</tbody>';
}

function renderCatalog() {
  const rows = RULES.map(r => '<tr><td class="m">' + String(r.n).padStart(2, '0') + '</td><td><span class="kind ' + r.k + '">' + t('kind.' + r.k) + '</span></td><td class="m">' + esc(r.type) + '</td><td class="wrap">' + esc(noteOf(r)) + '</td><td class="m">' + esc(r.g === 'sewer' ? t('any') : r.accept[0] + (r.g === 'line' ? '.' : '')) + '</td><td class="m">' + esc(r.out) + '</td><td class="wrap">' + esc(clsTitle(r.cls)) + '</td></tr>').join('');
  document.getElementById('catalogTable').innerHTML = '<thead><tr><th>' + t('th.num') + '</th><th>' + t('th.kind') + '</th><th>' + t('th.sys') + '</th><th>' + t('th.what') + '</th><th>' + t('th.wait') + '</th><th>' + t('th.put') + '</th><th>' + t('th.equip') + '</th></tr></thead><tbody>' + rows + '</tbody>';
}

// ===== navigation: progress line, active section, side dots =====
const bands = [...document.querySelectorAll('section[data-nav]')];
const links = [...document.querySelectorAll('#links a')];
const dots = document.getElementById('dots');
function renderDots() {
  dots.innerHTML = '';
  for (const sec of bands) {
    const a = document.createElement('a');
    a.href = '#' + sec.id; a.dataset.label = t(sec.dataset.nav); a.setAttribute('aria-label', t(sec.dataset.nav));
    dots.appendChild(a);
  }
  updateNav();
}
const bar = document.getElementById('progress');
function updateNav() {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(scrollY / max, 1) : 0) + ')';
  let cur = bands[0];
  for (const sec of bands) if (sec.getBoundingClientRect().top <= innerHeight * 0.35) cur = sec;
  links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + cur.id));
  [...dots.children].forEach((d, i) => { if (bands[i] === cur) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
  const act = document.querySelector('#links a.active');
  if (act) { const box = act.parentElement; box.scrollLeft = act.offsetLeft - box.clientWidth / 2 + act.clientWidth / 2; }
}
addEventListener('scroll', updateNav, { passive: true });
addEventListener('resize', updateNav);

// ===== draw everything, and again when the language changes =====
function renderAll() {
  document.documentElement.lang = lang;
  document.title = t('title') + ' · HVAC Stuff';
  applyStatic(document);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  fillTypeSelect(sel);
  eqRowsEl.querySelectorAll('select').forEach(fillTypeSelect);
  refresh(); renderOwner(); renderGroups(); renderSort(); renderCatalog(); renderEqPresets(); eqRefresh(); renderEqExamples(); renderDots();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('hvac-lang', lang); } catch (e) { /* storage may be unavailable */ }
  renderAll();
}));
renderAll();
